[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.4.0"
description = "Full-text search engine CLI with BM25/TF-IDF ranking and boolean query language."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.9.0",
    "typer>=0.12.5",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.115.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.vs/",
    "/.hypothesis/",
    "/.pytest_cache/",
    "/.ruff_cache/",
    "/.venv/",
    "/dist/",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: tests that take longer than one second to execute",
]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]